<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acompanhamento Nutricional</title>
<meta name="theme-color" content="#4f7f6c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de consultório — barra superior com a marca; no tablet, lista de pacientes à esquerda e prontuário à direita; no celular, uma tela por vez. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#e9efeb; --line:#d5dfd9;
  --fg:#1d2a25; --muted:#5b6d66; --brand:#4f7f6c; --brand-ink:#ffffff; --brand-soft:#dde9e3;
  --ok:#2f7d4f; --warn:#a86a12; --bad:#b23b3b; --info:#36618f;
  --c1:#4f7f6c; --c2:#b46a3c; --c3:#36618f;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Figtree","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Roboto Mono",monospace;
  --plate:#ffffff; --r:12px; --shadow:0 1px 2px rgba(30,50,42,.06),0 6px 18px rgba(30,50,42,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121916; --surface:#19221e; --surface-2:#212c27; --line:#2f3d36;
  --fg:#e5ede9; --muted:#9fb2aa; --brand:#8dbca8; --brand-ink:#10201a; --brand-soft:#253a31;
  --ok:#6cc08c; --warn:#e0a34d; --bad:#ef7c7c; --info:#86b3e3;
  --c1:#8dbca8; --c2:#e39a6b; --c3:#86b3e3; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121916; --surface:#19221e; --surface-2:#212c27; --line:#2f3d36;
  --fg:#e5ede9; --muted:#9fb2aa; --brand:#8dbca8; --brand-ink:#10201a; --brand-soft:#253a31;
  --ok:#6cc08c; --warn:#e0a34d; --bad:#ef7c7c; --info:#86b3e3;
  --c1:#8dbca8; --c2:#e39a6b; --c3:#86b3e3; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px}
.logo{height:46px;width:auto;max-width:40vw;background:var(--plate);border-radius:8px;padding:2px 6px;flex:none;display:block}
.cover{background:var(--plate);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;justify-content:center;margin-bottom:18px}
.cover img{width:100%;max-width:420px;height:auto;display:block}
@media (max-width:839px){body:not(.show-detail) .top .logo{display:none}}
.app-name{display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line);padding-left:14px}
.app-name b{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.1;letter-spacing:.2px}
.app-name small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.top .spacer{flex:1}
.store-pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.store-pill.warn{color:var(--warn);border-color:currentColor}
@media (max-width:520px){.app-name small{display:none}.logo{height:38px}.app-name b{font-size:18px}.store-pill{display:none}}

/* Shell */
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100% - 60px)}
.pane{min-width:0;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.list-pane{background:var(--bg)}
.detail-pane{display:none}
body.show-detail .list-pane{display:none}
body.show-detail .detail-pane{display:block}
@media (min-width:840px){
  .shell{grid-template-columns:340px 1fr}
  .list-pane{display:block!important;border-right:1px solid var(--line);height:calc(100vh - 62px);overflow:auto;position:sticky;top:62px}
  .detail-pane{display:block!important;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
  .back{display:none!important}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:9px 14px;min-height:42px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--line)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Patient list */
.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:44px}
.plist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.pitem{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.pitem:hover{background:var(--surface-2)}
.pitem.active{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.pitem .meta{min-width:0;flex:1}
.pitem .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 10px}
.list-head h2{font-family:var(--display);font-size:26px;font-weight:600;margin:0}
.count{color:var(--muted);font-size:13px}

/* Detail */
.ph{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ph .avatar{width:56px;height:56px;font-size:19px}
.ph h1{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.1;margin:0;text-wrap:balance}
.ph .facts{color:var(--muted);font-size:14px;display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:4px}
.ph .grow{flex:1;min-width:200px}
.tabs{display:flex;gap:4px;margin:18px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;min-height:44px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--brand)}
.tab .n{font-family:var(--mono);font-size:11px;background:var(--surface-2);border-radius:999px;padding:1px 6px;margin-left:4px;color:var(--muted)}

.section-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted);margin-left:3px}
.kpi .d{font-size:12px;margin-top:2px;font-family:var(--mono)}
.up{color:var(--warn)} .down{color:var(--ok)} .flat{color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid currentColor}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.info{color:var(--info)}

.records{display:flex;flex-direction:column;gap:10px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.rec-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rec-head b{font-weight:700}
.rec-date{font-family:var(--mono);font-size:13px;color:var(--muted)}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px 14px;margin-top:10px}
.rec-grid div{min-width:0}
.rec-grid .l{font-size:11.5px;color:var(--muted)}
.rec-grid .v{font-family:var(--mono);font-size:14px}
.rec p{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.rec dl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:4px 14px;margin:10px 0 0;font-size:14px}
.rec dt{color:var(--muted)} .rec dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
@media (max-width:520px){.rec dl{grid-template-columns:1fr}.rec dd{margin-bottom:6px}}

.chart-wrap{overflow-x:auto}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.chart-legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:11px var(--mono)}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 14px 18px}
.timeline li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.timeline .t{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.cmp{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.cmp th,.cmp td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{font-size:12px;color:var(--muted);font-weight:600}
.cmp td{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cmp td:first-child{font-family:var(--body)}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h3{font-family:var(--display);font-size:24px;color:var(--fg);margin:0 0 6px;font-weight:600}
.empty p{max-width:46ch;margin:0 auto 16px}

/* Sheet (form) */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:50;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:840px){.sheet-bg{align-items:center}.sheet{border-radius:16px;max-height:90vh}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-head h3{margin:0;font-size:17px;flex:1}
.sheet-body{overflow:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.sheet-foot{display:flex;gap:10px;justify-content:space-between;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
fieldset{border:0;margin:0;padding:0}
legend{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 8px;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f label .u{font-weight:400;font-family:var(--mono);font-size:11.5px}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;min-height:44px;width:100%}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.live{position:sticky;top:-12px;z-index:2;background:var(--brand-soft);border-radius:10px;padding:10px 12px;margin:0 0 6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px 12px}
.live div{min-width:0}
.live .l{font-size:11px;color:var(--muted)} .live .v{font-family:var(--mono);font-size:15px}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.err{color:var(--bad);font-size:13px;margin:8px 0 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;border-radius:999px;box-shadow:0 6px 20px rgba(30,60,48,.28);min-height:54px;padding:0 20px}
@media (min-width:840px){.fab{display:none}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.mcard header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mcard header b{font-size:15px;line-height:1.25}
.mval{font-size:19px;white-space:nowrap;color:var(--brand)} .mval small{font-size:12px;color:var(--muted);margin-left:3px}
.mcard .evo{margin:0;font-size:14px;line-height:1.45}
.mdl{display:grid;gap:1px;margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.mdl dt{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--brand);margin-top:6px}
.mdl dd{margin:0}
.report-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.report-bar p{margin:0;font-size:13.5px;max-width:60ch}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.ready{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:14px;border:1px solid var(--brand);border-radius:var(--r);background:var(--surface)}
.settings{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.settings p{font-size:12.5px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

/* ---------- armazenamento ---------- */
const LS_KEY = "acomp-nutri-v1";
const store = {
  mode: "loading", col: null, cache: [],
  async init() {
    if (window.AndroidApp) { // aplicativo Android: arquivo privado no aparelho
      this.mode = "device";
      try { this.cache = JSON.parse(AndroidApp.load() || "[]"); } catch (e) { this.cache = []; }
      return;
    }
    let db = null, user = null;
    try { if (window.claude && claude.use) { [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); } } catch (e) {}
    let id = null; try { id = user ? await user.id() : null; } catch (e) {}
    if (db && id) {
      this.col = db.collection("data/users/" + id + "/pacientes");
      try { const snap = await this.col.get(); this.cache = snap.docs.filter(d => d.exists).map(d => JSON.parse(JSON.stringify(d.data()))); this.mode = "db"; return; }
      catch (e) { console.warn("db indisponível", e); }
    }
    this.mode = "local";
    try { this.cache = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { this.cache = []; }
  },
  persistLocal() {
    if (this.mode === "device") { try { return AndroidApp.save(JSON.stringify(this.cache)) === true; } catch (e) { return false; } }
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.cache)); return true; } catch (e) { return false; } },
  async save(p) {
    p.atualizado = new Date().toISOString();
    const i = this.cache.findIndex(x => x.id === p.id); if (i >= 0) this.cache[i] = p; else this.cache.push(p);
    if (this.mode === "db") await this.col.doc(p.id).set(JSON.parse(JSON.stringify(p)));
    else if (!this.persistLocal()) throw new Error(this.mode === "device" ? "o aparelho não permitiu gravar. Verifique se há espaço livre." : "o navegador bloqueou o armazenamento local.");
  },
  async remove(id) {
    this.cache = this.cache.filter(x => x.id !== id);
    if (this.mode === "db") await this.col.doc(id).delete();
    else if (!this.persistLocal()) throw new Error("não foi possível gravar a exclusão.");
  },
  get(id) { return this.cache.find(x => x.id === id); }
};

    ${store.cache.length ? `<ul class="plist">${listHTML || '<li class="empty" style="padding:20px">Nenhum paciente encontrado.</li>'}</ul>` :
      `<div class="empty"><h3>Nenhum paciente ainda</h3><p>Cadastre o primeiro paciente ou carregue um exemplo para conhecer o app.</p>
       <button class="btn" data-act="sample" type="button">Carregar paciente de exemplo</button></div>`}
    <div class="settings">
      <div class="row"><button class="btn sm" data-act="export" type="button">Exportar backup</button><button class="btn sm" data-act="import" type="button">Importar backup</button></div>
      <p id="storeNote"></p>
    </div>`;
  const note = $("#storeNote");
  note.textContent = store.mode === "db" ? "Dados salvos na sua conta, visíveis apenas para você, em qualquer aparelho em que abrir este app."
    : store.mode === "device" ? "Dados guardados neste aparelho. Exporte um backup de vez em quando e guarde no Google Drive."
    : "Dados salvos somente neste aparelho. Faça backups com frequência.";
  const qi = $("#q"); qi.addEventListener("input", e => { state.q = e.target.value; const pos = e.target.selectionStart; renderList(); const nq = $("#q"); nq.focus(); nq.setSelectionRange(pos, pos); });
}

function viewRecords(kind, list, fn) {
  const label = {anamnese: "Nova anamnese", antro: "Nova avaliação antropométrica", bio: "Nova bioimpedância"}[kind];
  const emptyTxt = {anamnese: "Registre objetivo, treino, histórico clínico, hábitos e recordatório alimentar.", antro: "Registre peso, altura, circunferências e dobras. IMC, % de gordura, massa magra e gasto energético são calculados na hora.", bio: "Lance os resultados do laudo do aparelho de bioimpedância para acompanhar a evolução."}[kind];
  return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="count">${list.length} registro${list.length === 1 ? "" : "s"}</span>
    <button class="btn" data-act="add" data-kind="${kind}" type="button">+ ${label}</button></div>
    ${list.length ? `<div class="records">${list.map(fn).join("")}</div>` : `<div class="empty card"><h3>Sem registros</h3><p>${emptyTxt}</p><button class="btn primary" data-act="add" data-kind="${kind}" type="button">+ ${label}</button></div>`}`;
}
const recHead = (kind, r, title, extra = "") => `<div class="rec-head"><div><b>${esc(title)}</b> <span class="rec-date">${fdate(r.data)}</span> ${extra}</div>
  <div class="row"><button class="btn sm" data-act="edit" data-kind="${kind}" data-rid="${esc(r.id)}" type="button">Editar</button></div></div>`;
const cell = (l, v) => `<div><div class="l">${esc(l)}</div><div class="v">${v}</div></div>`;

function viewAnam(r) {
  const rows = ANAM_FIELDS.filter(f => f.k && f.k !== "data" && r[f.k] !== "" && r[f.k] != null)
    .map(f => `<dt>${esc(f.l)}</dt><dd>${esc(r[f.k])}${f.u ? " " + esc(f.u) : ""}</dd>`).join("");
  return `<article class="rec">${recHead("anamnese", r, "Anamnese", r.objetivo ? `<span class="chip info">${esc(r.objetivo)}</span>` : "")}<dl>${rows || "<dd>Sem dados preenchidos.</dd>"}</dl></article>`;
}
function viewAntro(r, p) {
  const c = calcAntro(r, p);
  const circ = ANTRO_FIELDS.filter(f => f.k && f.k.startsWith("c_") && n(r[f.k]) != null).map(f => cell(f.l, fmt(n(r[f.k])) + " cm")).join("");
  const dob = ANTRO_FIELDS.filter(f => f.k && f.k.startsWith("d_") && n(r[f.k]) != null).map(f => cell(f.l, fmt(n(r[f.k])) + " mm")).join("");
  return `<article class="rec">${recHead("antro", r, "Antropometria")}
    <div class="rec-grid">${cell("Peso", fmt(n(r.peso)) + " kg")}${cell("Altura", fmt(n(r.altura), 0) + " cm")}${cell("IMC", fmt(c.imc) + " kg/m²")}
    ${c.rcq ? cell("Relação cintura/quadril", fmt(c.rcq, 2)) : ""}${c.rce ? cell("Relação cintura/estatura", fmt(c.rce, 2)) : ""}
    ${c.pg != null ? cell("% Gordura", fmt(c.pg) + " %") + cell("Massa gorda", fmt(c.mg) + " kg") + cell("Massa magra", fmt(c.mlg) + " kg") : ""}
    ${c.somaDobras ? cell("Soma das dobras", fmt(c.somaDobras) + " mm") : ""}
    ${c.tmbCunningham ? cell("TMB Cunningham", fmt(c.tmbCunningham, 0) + " kcal") : ""}${c.tmbMifflin ? cell("TMB Mifflin", fmt(c.tmbMifflin, 0) + " kcal") : ""}
    ${c.get ? cell("GET", fmt(c.get, 0) + " kcal") : ""}</div>
    <div class="row" style="margin-top:8px">${chip(imcClass(c.imc))} ${chip(rcqClass(c.rcq, p.sexo))} ${c.pg != null ? chip(pgClass(c.pg, p.sexo)) : ""}${c.protocolo ? `<span class="count">${esc(c.protocolo)}</span>` : ""}</div>
    ${circ ? `<div class="section-title" style="margin:14px 0 0">Circunferências</div><div class="rec-grid">${circ}</div>` : ""}
    ${dob ? `<div class="section-title" style="margin:14px 0 0">Dobras cutâneas</div><div class="rec-grid">${dob}</div>` : ""}
    ${r.obs ? `<p>${esc(r.obs)}</p>` : ""}</article>`;
}
function viewBio(r) {
  const cells = BIO_KPIS.filter(([k]) => n(r[k]) != null).map(([k, l, u, d]) => cell(l, fmt(n(r[k]), d) + (u ? " " + u : ""))).join("");
  return `<article class="rec">${recHead("bio", r, "Bioimpedância", r.aparelho ? `<span class="count">${esc(r.aparelho)}</span>` : "")}<div class="rec-grid">${cells || "—"}</div>${r.obs ? `<p>${esc(r.obs)}</p>` : ""}</article>`;
}
function viewDados(p) {
  const rows = PAC_FIELDS.filter(f => f.k && p[f.k]).map(f => {
    let v = p[f.k]; if (f.k === "nascimento") v = fdate(v); if (f.k === "sexo") v = v === "F" ? "Feminino" : "Masculino";
    return `<dt>${esc(f.l)}</dt><dd>${esc(v)}</dd>`; }).join("");
  return `<article class="rec"><div class="rec-head"><b>Dados cadastrais</b><div class="row"><button class="btn sm" data-act="edit-pac" type="button">Editar cadastro</button></div></div><dl>${rows}</dl>
    <p class="hint">Cadastrado em ${fdate((p.criado || "").slice(0, 10))}${p.atualizado ? " · atualizado em " + fdate(p.atualizado.slice(0, 10)) : ""}</p></article>
    <div class="row" style="margin-top:18px"><button class="btn danger" data-act="del-pac" type="button">Excluir paciente</button></div>`;
}

/* série de evolução: combina antropometria e bioimpedância por data */
function series(p, T, B) {
  const pts = {};
  T.forEach(r => { const c = calcAntro(r, p); const o = pts[r.data] = pts[r.data] || {data: r.data};
    if (n(r.peso) != null) o.peso = n(r.peso); if (c.pg != null) o.pgA = c.pg; if (c.mlg != null) o.mlg = c.mlg; if (n(r.c_cintura) != null) o.cintura = n(r.c_cintura); });
  B.forEach(r => { const o = pts[r.data] = pts[r.data] || {data: r.data};
    if (o.peso == null && n(r.peso) != null) o.peso = n(r.peso); if (n(r.pg) != null) o.pgB = n(r.pg); if (n(r.mme) != null) o.mme = n(r.mme); });
  return Object.values(pts).sort((a, b) => a.data.localeCompare(b.data));
}
function delta(a, b, d = 1, lowerIsBetter = true) {
  if (a == null || b == null) return "";
  const v = b - a; const cls = Math.abs(v) < 0.05 ? "flat" : (v < 0) === lowerIsBetter ? "down" : "up";
  return `<div class="d ${cls}">${v > 0 ? "+" : ""}${fmt(v, d)} desde a 1ª</div>`;
}
function viewResumo(p, A, T, B) {
  if (!A.length && !T.length && !B.length) return `<div class="empty card"><h3>Comece o acompanhamento</h3><p>Registre a anamnese e a primeira avaliação. A evolução de peso, gordura e massa magra aparece aqui automaticamente.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" data-act="add" data-kind="anamnese" type="button">+ Anamnese</button><button class="btn" data-act="add" data-kind="antro" type="button">+ Antropometria</button><button class="btn" data-act="add" data-kind="bio" type="button">+ Bioimpedância</button></div></div>`;
  const s = series(p, T, B); const first = s[0], last = s[s.length - 1];
  const lastT = T[0], cT = lastT ? calcAntro(lastT, p) : {}, firstT = T[T.length - 1], cF = firstT ? calcAntro(firstT, p) : {};
  const lastB = B[0], firstB = B[B.length - 1];
  const pick = (k) => { for (let i = s.length - 1; i >= 0; i--) if (s[i][k] != null) return s[i][k]; return null; };
  const pickF = (k) => { for (const d of s) if (d[k] != null) return d[k]; return null; };
  const pgNow = cT.pg ?? (lastB ? n(lastB.pg) : null), pgFirst = cF.pg ?? (firstB ? n(firstB.pg) : null);
  const kpis = [
    `<div class="kpi"><div class="l">Peso</div><div class="v">${fmt(pick("peso"))}<small>kg</small></div>${s.length > 1 ? delta(pickF("peso"), pick("peso")) : ""}</div>`,
    cT.imc != null ? `<div class="kpi"><div class="l">IMC</div><div class="v">${fmt(cT.imc)}</div><div class="d">${chip(imcClass(cT.imc))}</div></div>` : "",
    pgNow != null ? `<div class="kpi"><div class="l">% Gordura</div><div class="v">${fmt(pgNow)}<small>%</small></div>${pgFirst != null && s.length > 1 ? delta(pgFirst, pgNow) : `<div class="d">${chip(pgClass(pgNow, p.sexo))}</div>`}</div>` : "",
    (pick("mlg") ?? pick("mme")) != null ? `<div class="kpi"><div class="l">${pick("mlg") != null ? "Massa magra" : "Massa muscular"}</div><div class="v">${fmt(pick("mlg") ?? pick("mme"))}<small>kg</small></div>${s.length > 1 ? delta(pickF(pick("mlg") != null ? "mlg" : "mme"), pick("mlg") ?? pick("mme"), 1, false) : ""}</div>` : "",
    cT.get ? `<div class="kpi"><div class="l">Gasto energético total</div><div class="v">${fmt(cT.get, 0)}<small>kcal</small></div><div class="d flat">${esc(cT.getBase)} × ${fmt(n(lastT.fator), 3)}</div></div>`
      : cT.tmbMifflin ? `<div class="kpi"><div class="l">TMB (Mifflin)</div><div class="v">${fmt(cT.tmbMifflin, 0)}<small>kcal</small></div></div>` : "",
    lastB && n(lastB.angulo) != null ? `<div class="kpi"><div class="l">Ângulo de fase</div><div class="v">${fmt(n(lastB.angulo))}<small>°</small></div></div>` : "",
  ].join("");
  let cmp = "";
  if (T.length > 1) {
    const rowsDef = [["Peso (kg)", r => n(r.peso), 1], ["IMC", (r, c) => c.imc, 1], ["% Gordura", (r, c) => c.pg, 1], ["Massa gorda (kg)", (r, c) => c.mg, 1], ["Massa magra (kg)", (r, c) => c.mlg, 1],
      ["Soma das dobras (mm)", (r, c) => c.somaDobras, 1], ["Cintura (cm)", r => n(r.c_cintura), 1], ["Abdome (cm)", r => n(r.c_abdome), 1], ["Quadril (cm)", r => n(r.c_quadril), 1], ["Braço contraído (cm)", r => n(r.c_braco_c), 1], ["Coxa (cm)", r => n(r.c_coxa), 1]];
    const tr = rowsDef.map(([l, f, d]) => { const a = f(firstT, cF), b = f(lastT, cT); if (a == null && b == null) return "";
      const dv = a != null && b != null ? b - a : null; return `<tr><td>${l}</td><td>${fmt(a, d)}</td><td>${fmt(b, d)}</td><td>${dv == null ? "—" : (dv > 0 ? "+" : "") + fmt(dv, d)}</td></tr>`; }).join("");
    cmp = `<div class="section-title">Primeira × última antropometria</div><div class="card chart-wrap"><table class="cmp"><thead><tr><th>Medida</th><th>${fdate(firstT.data)}</th><th>${fdate(lastT.data)}</th><th>Variação</th></tr></thead><tbody>${tr}</tbody></table></div>`;
  }
  const hist = [...A.map(r => ({d: r.data, t: "Anamnese", s: r.objetivo || ""})), ...T.map(r => { const c = calcAntro(r, p); return {d: r.data, t: "Antropometria", s: `${fmt(n(r.peso))} kg${c.pg != null ? " · " + fmt(c.pg) + "% gordura" : ""}`}; }),
    ...B.map(r => ({d: r.data, t: "Bioimpedância", s: [n(r.peso) != null ? fmt(n(r.peso)) + " kg" : "", n(r.pg) != null ? fmt(n(r.pg)) + "% gordura" : "", r.aparelho || ""].filter(Boolean).join(" · ")}))]
    .sort((a, b) => (b.d || "").localeCompare(a.d || ""));
  return `${T.length || B.length ? `<div class="report-bar"><p><b>Relatório para o paciente.</b> Gráfico e orientação de cada dado, com seu logo e contato, em PDF.</p><button class="btn primary" data-act="report" type="button">Gerar relatório PDF</button></div>` : ""}
    <div class="kpis">${kpis}</div>
    ${metricCardsHTML(p)}
    ${cmp}
    <div class="section-title">Histórico de atendimentos</div>
    <ul class="timeline">${hist.map(h => `<li><div class="t">${fdate(h.d)}</div><b>${h.t}</b>${h.s ? ` <span class="count">· ${esc(h.s)}</span>` : ""}</li>`).join("")}</ul>`;

const METRICS = buildMetrics();

function metricSeries(p, m) {
  const out = {};
  if (m.src !== "b") (p.antropometrias || []).forEach(r => { if (!r.data) return; const v = m.get(r, calcAntro(r, p)); if (v != null && isFinite(v)) out[r.data] = {data: r.data, v}; });
  if (m.src !== "a") (p.bioimpedancias || []).forEach(r => { if (!r.data) return; const v = m.get(r, {}); if (v != null && isFinite(v) && !(m.src === "ab" && out[r.data])) out[r.data] = {data: r.data, v, ap: r.aparelho}; });
  return Object.values(out).sort((a, b) => a.data.localeCompare(b.data));
}
function metricLabel(m, v) { return fmt(v, m.d) + (m.un ? (m.un === "%" || m.un === "°" ? "" : " ") + m.un : ""); }
function metricTrend(m, pts) {
  if (pts.length < 2) return null;
  const a = pts[0].v, b = pts[pts.length - 1].v, tol = Math.max(Math.pow(10, -m.d) / 2, Math.abs(a) * 0.005);
  if (Math.abs(b - a) <= tol) return "est";
  if (!m.dir) return (b > a) ? "up" : "down";
  return (b - a) * m.dir > 0 ? "fav" : "att";
}
function evolucaoTexto(m, pts) {
  const f = v => metricLabel(m, v);
  if (pts.length === 1) return `Primeira medida em ${fdate(pts[0].data)}: ${f(pts[0].v)}. A evolução aparece a partir da próxima avaliação.`;
  const a = pts[0], b = pts[pts.length - 1], dv = b.v - a.v, t = metricTrend(m, pts);
  let s = `De ${f(a.v)} em ${fdate(a.data)} para ${f(b.v)} em ${fdate(b.data)}`;
  if (t === "est") return s + ": manteve-se estável.";
  const pct = a.v && m.un !== "%" && m.d < 2 ? ` (${fmt(Math.abs(dv / a.v * 100), 1)}%)` : "";
  s += `: ${dv < 0 ? "redução" : "aumento"} de ${metricLabel(m, Math.abs(dv))}${pct}.`;
  if (t === "fav") s += " Evolução favorável.";
  if (t === "att") s += " Ponto de atenção.";
  return s;
}
function metricsFor(p, grupos) {
  return METRICS.filter(m => !grupos || grupos.includes(m.g)).map(m => ({m, pts: metricSeries(p, m)})).filter(x => x.pts.length);
}

function pickLabels(pts, X, gap) {
  const L = pts[pts.length - 1], out = [L];
  if (pts.length > 1 && X(L) - X(pts[0]) >= gap) out.unshift(pts[0]);
  for (let i = 1; i < pts.length - 1; i++) { const d = pts[i]; if (out.every(o => Math.abs(X(d) - X(o)) >= gap)) out.push(d); }
  return out.sort((a, b) => a.data.localeCompare(b.data));
}
function chartSVG(pts, thr, m) {
  const W = 340, H = 150, pl = 42, pr = 14, pt = 12, pb = 24;
  const vals = pts.map(d => d.v);
  let lo = Math.min(...vals), hi = Math.max(...vals); const span0 = Math.max(hi - lo, Math.abs(hi) * 0.04, Math.pow(10, -m.d) * 4);
  if (hi - lo < span0) { const mid = (hi + lo) / 2; lo = mid - span0 / 2; hi = mid + span0 / 2; }
  const vis = (thr || []).filter(t => t.v >= lo - (hi - lo) * .35 && t.v <= hi + (hi - lo) * .35);
  vis.forEach(t => { lo = Math.min(lo, t.v); hi = Math.max(hi, t.v); });
  const padv = (hi - lo) * .12; lo -= padv; hi += padv;
  const t0 = new Date(pts[0].data).getTime(), t1 = new Date(pts[pts.length - 1].data).getTime();
  const x = d => pts.length === 1 || t1 === t0 ? (pl + W - pr) / 2 : pl + (new Date(d.data).getTime() - t0) / (t1 - t0) * (W - pl - pr);
  const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const dd = (hi - lo) >= 8 ? 0 : (hi - lo) >= .8 ? 1 : (hi - lo) >= .08 ? 2 : 3;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, yy = y(v);
    g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${yy + 4}" text-anchor="end">${fmt(v, dd)}</text>`; }
  vis.forEach(t => { const yy = y(t.v); g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="5 4"/><text x="${pl + 4}" y="${yy - 4}" text-anchor="start" style="fill:var(--warn)">${esc(t.l)}</text>`; });
  pickLabels(pts, x, 60).forEach(d => g += `<text x="${Math.min(Math.max(x(d), pl + 4), W - 30)}" y="${H - 6}" text-anchor="middle">${fdate(d.data).slice(0, 5)}/${d.data.slice(2, 4)}</text>`);
  if (pts.length > 1) g += `<polyline fill="none" stroke="var(--c1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(d => x(d) + "," + y(d.v)).join(" ")}"/>`;
  pts.forEach((d, i) => { const last = i === pts.length - 1;

function fieldHTML(f, v) {
  if (f.legend) return `</div></fieldset><fieldset><legend>${esc(f.legend)}</legend><div class="grid">`;
  if (f.hint) return `<p class="hint f wide">${esc(f.hint)}</p>`;
  const id = "f_" + f.k, lab = `<label for="${id}">${esc(f.l)}${f.req ? " *" : ""}${f.u ? ` <span class="u">(${esc(f.u)})</span>` : ""}</label>`;
  const val = v ?? "";
  let inp;
  if (f.t === "select") inp = `<select id="${id}" name="${f.k}">${f.opts.map(([a, b]) => `<option value="${esc(a)}" ${String(val) === a ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>`;
  else if (f.t === "textarea") inp = `<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph || "")}">${esc(val)}</textarea>`;
  else if (f.t === "number") inp = `<input id="${id}" name="${f.k}" type="text" inputmode="decimal" value="${esc(val)}" autocomplete="off">`;
  else inp = `<input id="${id}" name="${f.k}" type="${f.t || "text"}" value="${esc(val)}" placeholder="${esc(f.ph || "")}" ${f.t === "email" ? 'inputmode="email"' : ""}>`;
  return `<div class="f ${f.wide || f.t === "textarea" ? "wide" : ""}">${lab}${inp}</div>`;
}
const SCHEMA = {pac: PAC_FIELDS, anamnese: ANAM_FIELDS, antro: ANTRO_FIELDS, bio: BIO_FIELDS};
const ARR = {anamnese: "anamneses", antro: "antropometrias", bio: "bioimpedancias"};
const TITLE = {pac: "paciente", anamnese: "anamnese", antro: "avaliação antropométrica", bio: "bioimpedância"};

function openForm(kind, rec) {
  const fields = SCHEMA[kind]; const isNew = !rec; rec = rec || {data: today()};
  const p = state.sel && store.get(state.sel);
  if (kind === "antro" && isNew && p) { const prev = (p.antropometrias || []).slice().sort(byDateDesc)[0]; if (prev) { rec.altura = prev.altura; rec.fator = prev.fator; } }
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<form class="sheet" novalidate role="dialog" aria-modal="true" aria-label="${isNew ? "Novo" : "Editar"} ${TITLE[kind]}">
    <div class="sheet-head"><button class="btn sm ghost" type="button" data-x>Cancelar</button><h3>${isNew ? (kind === "pac" ? "Novo" : "Nova") : "Editar"} ${TITLE[kind]}</h3><button class="btn sm primary" type="submit">Salvar</button></div>
    <div class="sheet-body">${kind === "antro" ? '<div class="live" id="live"></div>' : ""}<fieldset><div class="grid">${fields.map(f => fieldHTML(f, f.k ? rec[f.k] : null)).join("")}</div></fieldset><p class="err" id="ferr" hidden></p></div>
    <div class="sheet-foot">${!isNew && kind !== "pac" ? '<button class="btn danger" type="button" data-del>Excluir registro</button>' : "<span></span>"}<button class="btn primary" type="submit">Salvar</button></div></form>`;
  document.body.appendChild(bg); document.body.style.overflow = "hidden";
  const form = bg.querySelector("form");
  const close = () => { bg.remove(); document.body.style.overflow = ""; };
  const read = () => { const o = {...rec}; fields.forEach(f => { if (f.k) { const el = form.elements[f.k]; o[f.k] = (el.value || "").trim(); } }); return o; };
  bg.querySelector("[data-x]").onclick = close;
  bg.addEventListener("click", e => { if (e.target === bg) close(); });
  bg.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  if (kind === "antro") {
    const live = () => { const c = calcAntro(read(), p || {}); const L = (l, v) => `<div><div class="l">${l}</div><div class="v">${v}</div></div>`;
      $("#live").innerHTML = L("IMC", fmt(c.imc)) + L("% Gordura", c.pg != null ? fmt(c.pg) + "%" : "—") + L("Massa magra", c.mlg ? fmt(c.mlg) + " kg" : "—") + L("RCQ", fmt(c.rcq, 2)) + L("TMB", fmt(c.tmbCunningham || c.tmbMifflin, 0)) + L("GET", c.get ? fmt(c.get, 0) : "—"); };
    form.addEventListener("input", live); live();
  }
  const del = bg.querySelector("[data-del]");
  if (del) del.onclick = async () => {
    if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Toque de novo para excluir"; setTimeout(() => { del.classList.remove("armed"); del.textContent = "Excluir registro"; }, 4000); return; }
    p[ARR[kind]] = (p[ARR[kind]] || []).filter(x => x.id !== rec.id);
    try { await store.save(p); close(); toast("Registro excluído"); render(); } catch (e) { showErr("Não foi possível excluir: " + (e.message || e)); }
  };
  const showErr = m => { const er = $("#ferr"); er.textContent = m; er.hidden = false; er.scrollIntoView({block: "nearest"}); };
  form.addEventListener("submit", async e => {
    e.preventDefault(); const o = read();
    const miss = fields.filter(f => f.req && !o[f.k]).map(f => f.l); if (miss.length) return showErr("Preencha: " + miss.join(", ") + ".");
    const bad = fields.filter(f => f.t === "number" && o[f.k] && n(o[f.k]) == null).map(f => f.l); if (bad.length) return showErr("Use apenas números em: " + bad.join(", ") + ".");
    try {
      if (kind === "pac") { const pac = isNew ? {id: uid(), criado: new Date().toISOString(), anamneses: [], antropometrias: [], bioimpedancias: []} : store.get(rec.id);
        Object.assign(pac, o); delete pac.exemplo; await store.save(pac); state.sel = pac.id; if (isNew) state.tab = "resumo"; }
      else { o.id = o.id || uid(); const arr = p[ARR[kind]] = p[ARR[kind]] || []; const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.push(o);
        await store.save(p); state.tab = kind === "antro" ? "antropometria" : kind; }
      close(); toast(isNew ? "Salvo" : "Alterações salvas"); render();
    } catch (err) { showErr("Não foi possível salvar: " + (err.message || err)); }
  });
  setTimeout(() => { const first = form.querySelector("input:not([type=date]),select,textarea"); if (first && matchMedia("(min-width:840px)").matches) first.focus(); }, 50);
}

/* ---------- backup ---------- */
async function exportBackup() {
  const data = JSON.stringify({app: "Acompanhamento Nutricional", versao: 1, exportado: new Date().toISOString(), pacientes: store.cache}, null, 2);
  if (window.AndroidApp) {
    window.__backupResult = r => toast(r === "ok" ? "Backup salvo" : r === "cancel" ? "Backup cancelado" : "Não foi possível salvar o backup");
    AndroidApp.saveBackup(`backup-acompanhamento-nutricional-${today()}.json`, data);
    return;
  }
  let dl = null; try { dl = await claude.use("downloads"); } catch (e) {}
  if (!dl) return toast("Exportação indisponível nesta tela");
  try { await dl.save({filename: `backup-acompanhamento-nutricional-${today()}.json`, data}); toast("Backup gerado"); } catch (e) { if (!e || e.code !== "declined") toast(e && e.code === "rate_limited" ? "Aguarde um instante e tente de novo" : "Backup não salvo"); }
}
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { const j = JSON.parse(await f.text()); const list = Array.isArray(j) ? j : j.pacientes; if (!Array.isArray(list)) throw new Error("arquivo sem lista de pacientes");
    let added = 0; for (const p of list) { if (!p || !p.id || !p.nome) continue; await store.save(p); added++; }
    toast(`${added} paciente${added === 1 ? "" : "s"} importado${added === 1 ? "" : "s"}`); render();
  } catch (err) { toast("Arquivo inválido: " + (err.message || err)); }
});

/* ---------- eventos ---------- */
document.addEventListener("click", async e => {
  const it = e.target.closest(".pitem"); if (it) { state.sel = it.dataset.id; state.tab = "resumo"; render(); window.scrollTo(0, 0); return; }
  const tb = e.target.closest("[data-tab]"); if (tb) { state.tab = tb.dataset.tab; renderDetail(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, p = state.sel && store.get(state.sel);
  if (act === "new-pac") openForm("pac");
  if (act === "edit-pac") openForm("pac", {...p});
  if (act === "back") { state.sel = null; render(); }
  if (act === "add") openForm(b.dataset.kind);
  if (act === "edit") { const r = (p[ARR[b.dataset.kind]] || []).find(x => x.id === b.dataset.rid); if (r) openForm(b.dataset.kind, {...r}); }
  if (act === "sample") { const s = samplePatient(); try { await store.save(s); state.sel = s.id; render(); toast("Paciente de exemplo carregado"); } catch (err) { toast("Não foi possível salvar"); } }
  if (act === "export") exportBackup();
  if (act === "report") openReport(p);
  if (act === "import") $("#importFile").click();
  if (act === "del-pac") {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = `Toque de novo para excluir ${p.nome.split(" ")[0]} e todo o histórico`; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Excluir paciente"; } }, 5000); return; }
    try { await store.remove(p.id); state.sel = null; render(); toast("Paciente excluído"); } catch (err) { toast("Não foi possível excluir"); }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList && e.target.classList.contains("pitem")) e.target.click(); });
$("#fab").onclick = () => openForm("pac");

function render() { renderList(); renderDetail();
  const pill = $("#storePill"); pill.textContent = store.mode === "db" ? "Salvo na sua conta" : store.mode === "device" ? "Salvo no aparelho" : store.mode === "local" ? "Salvo neste aparelho" : "Conectando…";
  pill.classList.toggle("warn", store.mode === "local"); }

  return false;
