name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar o aplicativo
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Mostrar o motivo do erro
        if: failure()
        run: |
          python3 - <<'PY'
          t = open('build.log', errors='replace').read()
          linhas = [l for l in t.splitlines() if ('error' in l.lower() or 'e: ' in l or 'failed' in l.lower()) and 'warning' not in l.lower()]
          i = t.find('What went wrong')
          trecho = t[max(0, i - 100): i + 2500] if i >= 0 else t[-2500:]
          def anota(titulo, texto):
              texto = texto.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::error title=' + titulo + '::' + texto[:6000])
          anota('O que deu errado', trecho)
          anota('Linhas com erro', '\n'.join(linhas[:60]))
          PY

      - name: Separar os arquivos
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/release/app-release.apk "saida/AcompanhamentoNutricional-${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "saida/AcompanhamentoNutricional-${{ github.run_number }}-PlayStore.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: AcompanhamentoNutricional-${{ github.run_number }}
          path: saida/*

      - name: Publicar para download no celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "versao-${{ github.run_number }}" saida/* \
            --title "Acompanhamento Nutricional - versão ${{ github.run_number }}" \
            --notes "No celular, toque no arquivo .apk para baixar e instalar. O arquivo .aab é só para enviar à Play Store."
